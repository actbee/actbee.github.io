<!DOCTYPE html>
<html lang="en">
<head>
	<script src="/js/include.js" defer></script>
	<script src="/js/analytics.js" defer></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23d93a1c'/%3E%3C/svg%3E">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
	<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap"></noscript>
	<title>Xuedan Zou</title>
	<link rel="stylesheet" type="text/css" href="/css/main.css">
</head>

<body class="home">
<div data-include="/layouts/nav.html"></div>
<div class="container">
	<section class="stage">
		<div class="intro">
			<h1 class="name"><span>Xuedan</span><span>Zou</span></h1>
		</div>

		<div class="name-zh" lang="zh-Hans" aria-label="邹雪丹">邹雪丹</div>

		<figure class="plate" id="plate"></figure>
	</section>
</div>
<script>
	(function () {
		var pic = [
			"/images/2.1.jpg",
			"/images/2.2.jpg",
			"/images/2.3.jpg",
			"/images/2.4.jpg",
			"/images/cover.png",
			"https://xuedananimation.wordpress.com/wp-content/uploads/2022/08/e2122345-2450-4d4b-a4c1-d02eff856359.png",
			"https://xuedananimation.wordpress.com/wp-content/uploads/2022/08/1411661913933_.pic_.jpg"
		];
		var mes = [
			"東京 Tokyo",
			"史 History",
			"商 Business",
			"権 Power",
			"美 Beautiful",
			"感 Feel"
		];

		var i = Math.floor(Math.random() * pic.length);
		var m = mes[Math.floor(Math.random() * mes.length)];
		var fig = document.getElementById('plate');

		var img = document.createElement('img');
		img.src = pic[i];
		img.alt = m;
		fig.appendChild(img);

		var cap = document.createElement('figcaption');
		var no = document.createElement('span');
		no.textContent = 'No. ' + String(i + 1).padStart(2, '0');
		var word = document.createElement('span');
		word.textContent = m;
		cap.appendChild(no);
		cap.appendChild(word);
		fig.appendChild(cap);
	})();
</script>
<div data-include="/layouts/footer.html"></div>
</body>
</html>
