<!DOCTYPE html>
<html lang="en">
<head>
	<script src="/js/include.js" defer></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23d93a1c'/%3E%3C/svg%3E">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
	<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap"></noscript>
	<script src="/js/analytics.js" defer></script>

	<title>Artwork · Xuedan Zou</title>
	<link rel="stylesheet" type="text/css" href="/css/main.css">
</head>
<body>
<div data-include="/layouts/nav.html"></div>
<div class="container">
	<p><br></p>
	<h1 data-lang="en">Artwork</h1>
	<h1 data-lang="zh" hidden>艺术</h1>
	<h1 data-lang="ja" hidden>アートワーク</h1>
	<p data-lang="en">A collection of my paintings and drawings. Click a series to view all works.</p>
	<p data-lang="zh" hidden>我的绘画与素描作品集。点击系列查看全部作品。</p>
	<p data-lang="ja" hidden>私の絵画とドローイングのコレクション。シリーズをクリックすると、全作品をご覧いただけます。</p>

	<div class="artwork-gallery">
		<div class="artwork-item" onclick="openSeries('2026_Oct')">
			<img src="/images/artworks/2026_Oct_a.jpg" alt="2026 Oct" loading="lazy" decoding="async" />
			<p class="artwork-label">2026 Oct</p>
		</div>
		<div class="artwork-item" onclick="openSeries('2026_Sep')">
			<img src="/images/artworks/2026_Sep_a.jpg" alt="2026 Sep" loading="lazy" decoding="async" />
			<p class="artwork-label">2026 Sep</p>
		</div>
		<div class="artwork-item" onclick="openSeries('2026_Aug')">
			<img src="/images/artworks/2026_Aug_a.jpg" alt="2026 Aug" loading="lazy" decoding="async" />
			<p class="artwork-label">2026 Aug</p>
		</div>
		<div class="artwork-item" onclick="openSeries('2026_June')">
			<img src="/images/artworks/2026_June_a.jpg" alt="2026 Jun" loading="lazy" decoding="async" />
			<p class="artwork-label">2026 Jun</p>
		</div>
		<div class="artwork-item" onclick="openSeries('2026_April')">
			<img src="/images/artworks/2026_April_a.jpg" alt="2026 Apr" loading="lazy" decoding="async" />
			<p class="artwork-label">2026 Apr</p>
		</div>
	</div>
	<p><br><br></p>
</div>

<!-- Series modal -->
<div id="artwork-modal" class="artwork-modal" onclick="closeModal()">
	<div class="artwork-modal-content" onclick="event.stopPropagation()">
		<button class="artwork-modal-close" onclick="closeModal()">&times;</button>
		<div id="artwork-modal-images" class="artwork-modal-images"></div>
		<div id="artwork-modal-info" class="artwork-modal-info"></div>
	</div>
</div>

<!-- Zoom overlay -->
<div id="artwork-zoom" class="artwork-zoom" onclick="closeZoom()">
	<img id="artwork-zoom-img" src="" alt="" />
</div>

<div data-include="/layouts/footer.html"></div>

<script>
	const SERIES = {
		'2026_Oct': {
			images: [
				'/images/artworks/2026_Oct_a.jpg',
				'/images/artworks/2026_Oct_b.jpg',
				'/images/artworks/2026_Oct_c.jpg',
				'/images/artworks/2026_Oct_d.jpg'
			],
			info: '都市生成-SEOUL · October 2026 · Acrylic painting · 455 × 380 mm'
		},
		'2026_Sep': {
			images: [
				'/images/artworks/2026_Sep_a.jpg',
				'/images/artworks/2026_Sep_b.jpg',
				'/images/artworks/2026_Sep_c.jpg'
			],
			info: 'Woman in the Water · September 2026 · Acrylic painting · 455 × 380 mm'
		},
		'2026_Aug': {
			images: [
				'/images/artworks/2026_Aug_a.jpg',
				'/images/artworks/2026_Aug_b.jpg'
			],
			info: 'California Blue · August 2026 · Acrylic painting · 455 × 380 mm'
		},
		'2026_June': {
			images: [
				'/images/artworks/2026_June_a.jpg',
				'/images/artworks/2026_June_b.jpg',
				'/images/artworks/2026_June_c.jpg',
				'/images/artworks/2026_June_d.jpg'
			],
			info: '28 Years Old · June 2026 · Acrylic painting · 455 × 455 mm'
		},
		'2026_April': {
			images: [
				'/images/artworks/2026_April_a.jpg',
				'/images/artworks/2026_April_b.jpg',
				'/images/artworks/2026_April_c.jpg',
				'/images/artworks/2026_April_d.jpg',
				'/images/artworks/2026_April_e.jpg'
			],
			info: 'Figure Practice · Jan–May 2026 · Drawing · 420 × 297 mm'
		}
	};

	function openSeries(name) {
		const series = SERIES[name];
		if (!series) return;

		document.getElementById('artwork-modal-images').innerHTML = series.images.map(src =>
			`<img src="${src}" alt="${name}" loading="lazy" decoding="async" style="cursor:zoom-in" onclick="openZoom(event, this.src)" />`
		).join('');

		document.getElementById('artwork-modal-info').innerHTML = series.info
			? `<p class="artwork-modal-caption">${series.info}</p>`
			: '';

		document.getElementById('artwork-modal').classList.add('is-open');
		document.body.style.overflow = 'hidden';
	}

	function closeModal() {
		document.getElementById('artwork-modal').classList.remove('is-open');
		document.body.style.overflow = '';
	}

	function openZoom(e, src) {
		e.stopPropagation();
		document.getElementById('artwork-zoom-img').src = src;
		document.getElementById('artwork-zoom').classList.add('is-open');
	}

	function closeZoom() {
		document.getElementById('artwork-zoom').classList.remove('is-open');
	}

	document.addEventListener('keydown', (e) => {
		if (e.key === 'Escape') {
			if (document.getElementById('artwork-zoom').classList.contains('is-open')) {
				closeZoom();
			} else {
				closeModal();
			}
		}
	});
</script>
</body>
</html>
