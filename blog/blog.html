<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23d93a1c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap"></noscript>
  <script src="/js/analytics.js" defer></script>
  <title>Blog · Xuedan Zou</title>
  <link rel="stylesheet" type="text/css" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js" defer></script> <!-- Showdown library -->
  <script src="/js/include.js" defer></script>
</head>

<body>
<div data-include="/layouts/nav.html"></div>
<div id="blog-title">
  <h1 id="blog-title-en" data-lang="en">Blog</h1>
  <h1 id="blog-title-zh" data-lang="zh" hidden>博客</h1>
  <h1 id="blog-title-ja" data-lang="ja" hidden>ブログ</h1>
</div>

<div id="blog-intro">
  <p id="blog-intro-en" data-lang="en">
    I am always trying to turn my thoughts into writing. For the latest articles, visit
    <a href="https://actbee.substack.com">my Substack</a>.
  </p>

  <p id="blog-intro-zh" data-lang="zh" hidden>
    他一直在尝试把自己的想法整理成文字。您可以在 <a href="https://actbee.substack.com">Substack</a> 查看最新文章。
  </p>

  <p id="blog-intro-ja" data-lang="ja" hidden>
    自分の考えを言語化して発信するようにしています。最新の記事は <a href="https://actbee.substack.com">Substack</a> でご覧いただけます。
  </p>
</div>
<ul class="posts" id="posts-list">
  <!-- Posts will be dynamically rendered here -->
</ul>
<div id="post-content" style="display: none;"></div>
<ul class="back-button">
  <li><button id="back-button" style="display: none;">Back</button></li>
</ul>

<script>
  async function loadMarkdownPosts() {
    const postsList = document.getElementById('posts-list');
    const jsonFile = '/blog/posts.json'; // Path to the JSON file

    try {
      const response = await fetch(jsonFile);
      if (!response.ok) {
        console.error(`Failed to load JSON file: ${jsonFile}`);
        postsList.innerHTML = '<p>Error loading posts list.</p>';
        return;
      }

      const markdownFiles = (await response.json()).sort().reverse();
      for (const file of markdownFiles) {
        const listItem = document.createElement('li');
        const link = document.createElement('a');
        link.href = `?post=${file}`;
        const m = file.match(/^(\d{4})-(\d{2})-(\d{2})-(.*)$/);
        const title = document.createElement('span');
        title.className = 'post-title';
        title.textContent = (m ? m[4] : file).replace(/-/g, ' ').trim();
        link.appendChild(title);
        if (m) {
          const date = document.createElement('span');
          date.className = 'post-date';
          date.textContent = `${m[1]}.${m[2]}.${m[3]}`;
          link.appendChild(date);
        }
        link.addEventListener('click', (event) => {
          event.preventDefault(); // Prevent default navigation
          loadPostContent(file); // Load the post content
        });
        listItem.appendChild(link);
        postsList.appendChild(listItem);
      }
    } catch (error) {
      console.error(error);
      postsList.innerHTML = '<p>Error loading posts.</p>';
    }
  }

  async function loadPostContent(post) {
    const postsList = document.getElementById('posts-list');
    const postContainer = document.getElementById('post-content');
    const backButton = document.getElementById('back-button');
    const blogTitle = document.getElementById('blog-title');
    const blogIntro = document.getElementById('blog-intro');

    // Hide elements
    postsList.style.display = 'none';
    postContainer.style.display = 'block';
    backButton.style.display = 'block';
    blogTitle.style.display = 'none';
    blogIntro.style.display = 'none';

    const markdownFile = `/blog/posts/${encodeURIComponent(post)}.md`;

    try {
      const response = await fetch(markdownFile);
      if (!response.ok) {
        throw new Error(`Failed to load file: ${markdownFile}`);
      }

      const markdownContent = await response.text();
      const converter = new showdown.Converter();
      const htmlContent = converter.makeHtml(markdownContent);
      postContainer.innerHTML = htmlContent;
    } catch (error) {
      console.error(error);
      postContainer.innerHTML = '<p>Error loading post content.</p>';
    }
  }

  function setupBackButton() {
    const backButton = document.getElementById('back-button');
    backButton.addEventListener('click', () => {
      document.getElementById('posts-list').style.display = 'block';
      document.getElementById('post-content').style.display = 'none';
      backButton.style.display = 'none';
      document.getElementById('blog-title').style.display = 'block';
      document.getElementById('blog-intro').style.display = 'block';
    });
  }

  // Initialize the page
  document.addEventListener('DOMContentLoaded', () => {
    setupBackButton();
    loadMarkdownPosts();
  });
</script>

<div data-include="/layouts/footer.html"></div>
</body>
</html>
